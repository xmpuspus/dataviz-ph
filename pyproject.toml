[project]
name = "dataviz-ph"
version = "0.0.1"
description = "Animated bubble chart for Philippine public data"
requires-python = ">=3.11"
# Pinned exact: these versions reproduce the committed public/data/*.json
# byte-for-byte. A floating range let a future pandas/pyarrow silently change
# the published numbers. Bump deliberately, then re-run `python -m etl.build`
# and review the data diff. See requirements.lock for the full pinned closure.
dependencies = [
    "httpx==0.28.1",
    "pyarrow==24.0.0",
    "pandas==3.0.3",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.14",
    "pytest>=8",
    "playwright==1.60.0",
]

[tool.setuptools.packages.find]
include = ["etl*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
