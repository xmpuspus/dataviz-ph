[project]
name = "plot-ph"
version = "0.0.1"
description = "Animated bubble chart for Philippine public data"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=17",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["etl*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
