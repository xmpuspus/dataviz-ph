name: CI

# Vercel's Git integration builds and ships public/ on every push to main, so
# this workflow only guards quality: lint, then run the suite (which includes
# the manifest drift guard and browser regression tests). No deploy step lives here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.4"

      - name: Install
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps -e "."
          python -m pip check

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: python-3.12.4-playwright-1.60.0-chromium

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test (includes manifest drift guard and browser regression)
        run: python -m pytest -q
