name: CI

# Vercel's Git integration builds and ships public/ on every push to main, so
# this workflow only guards quality: lint, then run the suite (which includes
# the manifest drift guard). No deploy step lives here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test (includes manifest drift guard)
        run: python -m pytest -q
